name: Lean CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify Lean project
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate proof inventory for diagnostic build
        run: |
          python3 tools/generate_proof_inventory.py
          git diff -- docs/generated/LEAN_MODULE_INDEX.md docs/generated/DECLARATION_INDEX.md docs/generated/LOCAL_IMPORT_EDGES.md

      # Installs the version pinned in lean-toolchain, restores the Lake cache,
      # fetches Mathlib's compiled cache, and runs `lake build`.
      - name: Build HC4
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      - name: Audit theorem axioms
        run: lake env lean HC4/Audit.lean

      - name: Cross-check external mathematical statement and logical dependencies
        run: lake env lean HC4/StatementAudit.lean

      - name: Audit the full polynomial-inverse equivalence
        run: lake env lean HC4/FinalEquivalence.lean

      - name: Check that the negative control is rejected
        run: |
          printf '%s\n' 'import HC4' 'example : (0 : Nat) = 1 := by rfl' > ReproductionNegativeControl.lean
          if lake env lean ReproductionNegativeControl.lean > negative-control.log 2>&1; then
            echo "Lean accepted the deliberately false negative control." >&2
            exit 1
          fi
          cat negative-control.log
          grep -qi 'rfl' negative-control.log
          rm ReproductionNegativeControl.lean

      - name: Advisory source scan (includes comments)
        run: |
          status=0
          rg -n '\b(sorry|admit|axiom|unsafe)\b' -g '*.lean' HC4 || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          echo 'The enforced transitive axiom allowlists above are authoritative for the final theorem.'
