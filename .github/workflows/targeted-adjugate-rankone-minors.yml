name: HC4 singular adjugate rank-one minors verification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build singular 3x3 adjugate rank-one minor identities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Targeted Lean compilation
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: HC4.Polynomial.RankThreeCubicAdjugateRankOneMinors
          test: false
          lint: false
      - name: Reject proof escape hatches
        run: |
          if grep -En '\\b(sorry|admit|axiom|unsafe)\\b' HC4/Polynomial/RankThreeCubicAdjugateRankOneMinors.lean; then
            exit 1
          fi
