name: Validate cubic source weighted degree
on:
  push:
    branches: [research/cubic-source-weighted-degree]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Restore mathlib cache
        run: lake exe cache get
      - name: Build source homogeneous specialization
        run: lake build HC4.Polynomial.RankThreeCubicSourceWeightedDegree
      - name: Audit source degree theorems
        run: lake env lean HC4/Polynomial/RankThreeCubicSourceWeightedDegreeAudit.lean
