name: HC4 rank-one Cramer quadratic contraction validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify nonzero Cramer residue implies adjugate contraction vanishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Targeted Lean compilation
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: HC4.Polynomial.RankThreeCubicRankOneQuadraticContraction
          test: false
          lint: false
      - name: Reject proof escape hatches
        run: |
          if grep -En '\\b(sorry|admit|axiom|unsafe)\\b' HC4/Polynomial/RankThreeCubicRankOneQuadraticContraction.lean; then
            exit 1
          fi
