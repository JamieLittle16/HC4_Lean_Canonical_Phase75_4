name: HC4 longitudinal polynomial map validation
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Build longitudinal polynomial scalar extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build targeted Lean module
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: HC4.Polynomial.RankThreeCubicLongitudinalPolynomialMap
          test: false
          lint: false
      - name: Reject proof escape hatches
        run: |
          if grep -En '\\b(sorry|admit|axiom|unsafe)\\b' HC4/Polynomial/RankThreeCubicLongitudinalPolynomialMap.lean; then exit 1; fi
