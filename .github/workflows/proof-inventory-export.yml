name: Proof inventory export

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate proof inventory
        run: python3 tools/generate_proof_inventory.py

      - name: Commit generated indexes when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/LEAN_MODULE_INDEX.md \
                  docs/generated/DECLARATION_INDEX.md \
                  docs/generated/LOCAL_IMPORT_EDGES.md
          if git diff --cached --quiet; then
            echo "Generated proof inventory is already current."
          else
            git commit -m "docs: refresh generated proof inventory"
            git push
          fi
