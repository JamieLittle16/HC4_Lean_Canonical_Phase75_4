name: HC4 cubic longitudinal third derivative validation
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Build cubic third-derivative source support
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build targeted Lean module
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: HC4.Polynomial.RankThreeCubicThirdDerivativeLongitudinal
          test: false
          lint: false
      - name: Reject proof escape hatches
        run: |
          if grep -En '\\b(sorry|admit|axiom|unsafe)\\b' HC4/Polynomial/RankThreeCubicThirdDerivativeLongitudinal.lean; then exit 1; fi
